name: musicplayer
description: "An offline music player application."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5+1
  audioplayers: ^6.1.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  lottie: ^3.3.1
  marquee: ^2.3.0
  on_audio_query: ^2.9.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/json/
    - assets/images/
    - assets/fonts/
